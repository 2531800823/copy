name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如 v1.0.0）'
        required: true
        default: v0.0.1

permissions:
  contents: read

jobs:
  build:
    name: 构建 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: macOS Universal
            os: macos-latest
            artifact: macos-universal

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/v
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: pnpm install --frozen-lockfile

      - name: 解析版本号
        id: version
        shell: bash
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RAW_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号必须采用 v1.2.3 或 v1.2.3-beta.1 格式"
            exit 1
          fi
          echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: 写入构建版本
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const file = 'packages/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.version = process.env.APP_VERSION;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "构建版本: $(node -p "require('./packages/desktop/package.json').version")"

      - name: 构建 Web 应用
        run: pnpm build:web

      - name: 编译 Electron 应用
        working-directory: packages/desktop
        run: |
          pnpm exec tsc
          pnpm exec vite build

      - name: 构建 Windows 安装包
        if: runner.os == 'Windows'
        working-directory: packages/desktop
        env:
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/v
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: pnpm exec electron-builder --config ./electron-builder.js --win nsis --x64 --publish never

      - name: 构建 macOS 安装包
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/v
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: pnpm exec electron-builder --config ./electron-builder.js --mac dmg zip --universal --publish never

      - name: 整理构建产物
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_DIR="packages/desktop/release/$APP_VERSION"
          ARTIFACT_DIR="ci-artifacts"

          if [ ! -d "$RELEASE_DIR" ]; then
            echo "::error::未找到构建目录 $RELEASE_DIR"
            exit 1
          fi

          mkdir -p "$ARTIFACT_DIR"
          find "$RELEASE_DIR" -maxdepth 1 -type f \( \
            -name '*.exe' -o \
            -name '*.exe.blockmap' -o \
            -name '*.dmg' -o \
            -name '*.dmg.blockmap' -o \
            -name '*.zip' -o \
            -name '*.zip.blockmap' -o \
            -name 'latest*.yml' \
          \) -exec cp {} "$ARTIFACT_DIR/" \;

          echo '=== 待上传产物 ==='
          find "$ARTIFACT_DIR" -maxdepth 1 -type f -print | sort

          if [ -z "$(find "$ARTIFACT_DIR" -maxdepth 1 -type f -print -quit)" ]; then
            echo "::error::没有找到可上传的构建产物"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 7

  release:
    name: 创建 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: 校验发布文件
        run: |
          set -euo pipefail
          echo '=== 发布文件 ==='
          find release-files -maxdepth 1 -type f -print | sort
          test -n "$(find release-files -maxdepth 1 -type f -name 'CopyApp-Windows-*.exe' -print -quit)"
          test -n "$(find release-files -maxdepth 1 -type f -name 'CopyApp-Mac-*.dmg' -print -quit)"
          test -n "$(find release-files -maxdepth 1 -type f -name 'CopyApp-Mac-*.zip' -print -quit)"
          test -f release-files/latest.yml
          test -f release-files/latest-mac.yml

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          name: CopyApp ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          files: release-files/*
          fail_on_unmatched_files: true
          body: |
            # CopyApp ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}

            ## 下载

            - Windows：下载 `CopyApp-Windows-*.exe`
            - macOS（Intel 和 Apple Silicon）：下载 `CopyApp-Mac-*.dmg`

            应用同时发布自动更新所需的元数据和差分文件。
