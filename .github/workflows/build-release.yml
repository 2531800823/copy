name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如: v1.0.0)'
        required: true
        default: v0.0.1

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 设置 PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10.10.0

      - name: 获取 PNPM 存储目录
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: 设置缓存
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装依赖
        env:
          # GHA 海外节点使用官方源；避免 .npmrc 国内镜像导致 electron 下载失败
          npm_config_registry: https://registry.npmjs.org/
        run: |
          pnpm config set node-linker hoisted
          pnpm install

      - name: 解析版本号
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${{ github.ref_name }}"
          fi
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: 构建 Web 应用
        run: pnpm build:web

      - name: 构建桌面应用并打包产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_CACHE: false
          APP_VERSION: ${{ steps.version.outputs.version }}
          npm_config_registry: https://registry.npmjs.org/
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/v
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail

          DESKTOP_DIR="$GITHUB_WORKSPACE/packages/desktop"
          cd "$DESKTOP_DIR"

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.APP_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "构建版本: $(node -p "require('./package.json').version")"

          if [ ! -d ../web/dist ]; then
            echo "::error::缺少 Web 构建产物 packages/web/dist"
            exit 1
          fi

          # 在 bash 中分步执行，避免 Windows 下 pnpm 用 cmd 跑脚本时 electron-builder 未执行
          echo ">>> tsc"
          pnpm exec tsc
          echo ">>> vite build"
          pnpm exec vite build
          echo ">>> electron-builder"
          pnpm exec electron-builder --project . --config ./electron-builder.js --win nsis

          resolve_release_root() {
            for dir in \
              "$DESKTOP_DIR/release" \
              "$GITHUB_WORKSPACE/release" \
              "$GITHUB_WORKSPACE/packages/desktop/release"
            do
              if [ -d "$dir" ] && find "$dir" -type f -name "CopyApp-Windows-*.exe" | grep -q .; then
                echo "$dir"
                return 0
              fi
            done
            return 1
          }

          RELEASE_ROOT="$(resolve_release_root || true)"
          if [ -z "$RELEASE_ROOT" ]; then
            echo "::error::未找到 release 目录或安装包"
            find "$GITHUB_WORKSPACE" -name "CopyApp-Windows-*.exe" -not -path "*/node_modules/*" || true
            exit 1
          fi

          echo "=== release 目录: $RELEASE_ROOT ==="
          ls -laR "$RELEASE_ROOT"

          mkdir -p "$GITHUB_WORKSPACE/ci-artifacts"
          while IFS= read -r -d '' file; do
            rel="${file#"$RELEASE_ROOT"/}"
            mkdir -p "$GITHUB_WORKSPACE/ci-artifacts/$(dirname "$rel")"
            cp "$file" "$GITHUB_WORKSPACE/ci-artifacts/$rel"
          done < <(find "$RELEASE_ROOT" -type f \
            ! -path "*/win-unpacked/*" \
            ! -path "*/linux-unpacked/*" \
            ! -path "*/mac/*" \
            -print0)

          echo "=== ci-artifacts 文件列表 ==="
          find "$GITHUB_WORKSPACE/ci-artifacts" -type f | sort

          if [ -z "$(find "$GITHUB_WORKSPACE/ci-artifacts" -type f -print -quit)" ]; then
            echo "::error::ci-artifacts 为空"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: ci-artifacts/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理发布文件
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f \( \
            -name "*.exe" -o \
            -name "*.exe.blockmap" -o \
            -name "*.dmg" -o \
            -name "*.dmg.blockmap" -o \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.yml" -o \
            -name "*.yaml" \
          \) -exec cp -t release-files/ {} +

          echo "=== 发布文件列表 ==="
          ls -la release-files/

          if [ -z "$(ls -A release-files)" ]; then
            echo "::error::未找到可发布的构建产物"
            exit 1
          fi

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          name: CopyApp ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          files: release-files/*
          fail_on_unmatched_files: true
          body: |
            # CopyApp 发布版本 ${{ github.event.inputs.version || github.ref_name }}

            ## 下载说明

            ### Windows
            下载 `CopyApp-Windows-*.exe`

            ## 自动更新
            应用支持自动更新，首次安装后会自动检查更新。
