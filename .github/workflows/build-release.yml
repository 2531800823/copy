name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如: v1.0.0)'
        required: true
        default: v0.0.1

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 设置 PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10.10.0

      - name: 获取 PNPM 存储目录
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: 设置缓存
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装依赖
        run: pnpm install

      - name: 解析版本号
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${{ github.ref_name }}"
          fi
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: 构建 Web 应用
        run: pnpm build:web

      - name: 构建桌面应用并打包产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_CACHE: false
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail

          cd packages/desktop

          # 用 Node 更新版本号（避免 Windows 上 sed -i 破坏 package.json）
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.APP_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "构建版本: $(node -p "require('./package.json').version")"

          if [ ! -d ../web/dist ]; then
            echo "::error::缺少 Web 构建产物 packages/web/dist，请先执行 pnpm build:web"
            exit 1
          fi

          pnpm build:win

          echo "=== electron-builder 输出 (packages/desktop/release) ==="
          if [ ! -d release ]; then
            echo "::error::release 目录不存在，electron-builder 可能未成功执行"
            cd ../..
            find . -name "CopyApp-Windows-*.exe" -not -path "*/node_modules/*" || true
            exit 1
          fi
          ls -laR release

          if ! find release -type f -name "CopyApp-Windows-*.exe" | grep -q .; then
            echo "::error::未找到 CopyApp-Windows-*.exe 安装包"
            exit 1
          fi

          # 立即复制到 ci-artifacts（upload-artifact 会忽略 .gitignore 中的 release/**）
          cd ../..
          mkdir -p ci-artifacts
          while IFS= read -r -d '' file; do
            rel="${file#packages/desktop/release/}"
            mkdir -p "ci-artifacts/$(dirname "$rel")"
            cp "$file" "ci-artifacts/$rel"
          done < <(find packages/desktop/release -type f \
            ! -path "*/win-unpacked/*" \
            ! -path "*/linux-unpacked/*" \
            ! -path "*/mac/*" \
            -print0)

          echo "=== ci-artifacts 文件列表 ==="
          find ci-artifacts -type f | sort

          if [ -z "$(find ci-artifacts -type f -print -quit)" ]; then
            echo "::error::ci-artifacts 为空"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: ci-artifacts/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理发布文件
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f \( \
            -name "*.exe" -o \
            -name "*.exe.blockmap" -o \
            -name "*.dmg" -o \
            -name "*.dmg.blockmap" -o \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.yml" -o \
            -name "*.yaml" \
          \) -exec cp -t release-files/ {} +

          echo "=== 发布文件列表 ==="
          ls -la release-files/

          if [ -z "$(ls -A release-files)" ]; then
            echo "::error::未找到可发布的构建产物"
            exit 1
          fi

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          name: CopyApp ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          files: release-files/*
          fail_on_unmatched_files: true
          body: |
            # CopyApp 发布版本 ${{ github.event.inputs.version || github.ref_name }}

            ## 下载说明

            ### Windows
            下载 `CopyApp-Windows-*.exe`

            ## 自动更新
            应用支持自动更新，首次安装后会自动检查更新。
